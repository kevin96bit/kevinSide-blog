<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient blu per effetto moderno -->
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Sfondo scuro circolare -->
  <circle cx="32" cy="32" r="30" fill="#111827" stroke="url(#blueGradient)" stroke-width="2"/>

  <!-- Lettera K (centrata perfettamente) -->
  <text
    x="50%"
    y="50%"
    dy="0.1em"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', Arial, sans-serif"
    font-size="48"
    font-weight="700"
    fill="url(#blueGradient)"
  >
    K
  </text>
</svg>
